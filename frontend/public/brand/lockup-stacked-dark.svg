<svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mytrima, dark background</title>
<desc>The M mark centered above the Mytrima wordmark and tagline chip, on the brand's own teal background — redrawn per the Mytrima Brand Style Guide v1.0, not an extracted source file.</desc>
<rect x="0" y="0" width="360" height="360" fill="#265757"/>
<path d="M 155 178 L 155 132 L 188 162 L 220 112 L 220 178"
      fill="none" stroke="#FFFFFF" stroke-width="16"
      stroke-linecap="round" stroke-linejoin="round"/>
<text x="180" y="238" text-anchor="middle" font-family="Jost, Century Gothic, Futura, sans-serif"
      font-weight="700" font-size="40" fill="#FFFFFF">Mytrima</text>
<rect x="90" y="256" width="180" height="30" rx="15" fill="#64CAC0"/>
<text x="180" y="276" text-anchor="middle" font-family="Jost, Century Gothic, Futura, sans-serif"
      font-weight="600" font-size="14" fill="#100F0D">Built for how you grow</text>
</svg>
