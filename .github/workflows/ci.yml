name: CI

# Per Technical Master Plan Section 11 (DevSecOps Pipeline): a failing check
# blocks merge, it does not just warn. This file has NOT been run against a
# real GitHub Actions runner — it was written and locally validated for
# syntax only (see README, "What was and wasn't verified"). Confirm it
# actually runs green on the first real PR before treating it as load-bearing.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Per Master Plan v1.2 (Section 9): the manual procedure in
  # db/tests/rls_negative.test.md has been converted into an automated script
  # (db/tests/rls_negative.sql), wired into a real Postgres service container
  # below. This job has been written and reviewed for syntax, but — like the
  # migrations it runs — has NOT been executed against a real GitHub Actions
  # runner in this environment (no Postgres instance was available here).
  # Confirm it actually goes green on the first real PR before treating it as
  # a passing check.
  db-rls-negative-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f db/migrations/0001_tenant_and_rls.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f db/migrations/0002_rating.sql
      - name: Create the non-superuser app role the negative test runs as
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c \
            "create role mytrima_app login password 'ci_only_password'; \
             grant select, insert, update, delete on all tables in schema public to mytrima_app;"
      - name: Run RLS negative test
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f db/tests/rls_negative.sql

  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder for Dependabot/Snyk-class scanning
        run: |
          echo "Master Plan Section 9/11 requires automated dependency and secret scanning on every PR."
          echo "Not wired up yet — enable GitHub Dependabot or a Snyk integration before Section 16 closes out."

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder for SAST (e.g. Semgrep)
        run: |
          echo "Master Plan Section 9/11 requires SAST as a CI gate, not an optional step."
          echo "Not wired up yet — add a Semgrep (or equivalent) job before Section 16 closes out."
