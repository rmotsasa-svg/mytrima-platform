name: CI

# Per Technical Master Plan Section 11 (DevSecOps Pipeline): a failing check
# blocks merge, it does not just warn. ACTUALLY RUN against real GitHub
# Actions infrastructure — not just written and locally validated for syntax.
# First real run: https://github.com/rmotsasa-svg/mytrima-platform/actions/runs/34267258451
# — Status: Success, all four jobs green, 33s total (see README, "RLS: proven
# live" for what test-and-typecheck and db-rls-negative-tests specifically
# proved).
#
# dependency-and-secret-scan and sast were real placeholders (echo statements)
# until this pass. dependency-and-secret-scan now runs `audit-ci` for real
# (see audit-ci.jsonc's own comment for the one documented, narrow exception —
# an unused transitive multer dependency with no viable non-breaking fix) —
# verified locally both ways: fails without the allowlist, passes with it.
# sast now runs a real Semgrep scan — this one could NOT be verified locally
# (Semgrep has no native Windows build, and this machine has neither Docker
# nor a usable WSL distro to run it another way); it was verified by its own
# actual GitHub Actions run, same as db-rls-negative-tests' Postgres service
# container above needed a real run to prove, not local guesswork. That
# first real run (https://github.com/rmotsasa-svg/mytrima-platform/actions/runs/34341580965)
# genuinely failed with 7 real findings, all the same rule
# (github-actions-mutable-action-tag): every third-party action below was
# referenced by a mutable tag (@v4/@v5) instead of a pinned commit SHA — a
# real supply-chain-security gap, not a tool false-positive or a config bug,
# exactly the kind of finding SAST exists to catch. Fixed by pinning every
# `uses:` line to its actual current tag's real commit SHA (looked up via
# GitHub's own API, not guessed), with the tag kept as a trailing comment for
# readability. See README's "CI: from honest placeholders to real scanners"
# section for the confirming re-run's result.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # REAL GAP found 2026-09-11 by the SPA Readiness Assessment: frontend/ had
  # no CI coverage at all — every "tsc -b and vite build both pass clean"
  # claim across seven SPA commits was true, but verified only by hand,
  # locally, never gated on a push. A regression here would merge to `main`
  # clean. Mirrors test-and-typecheck's own shape (checkout, setup-node,
  # install, typecheck+build, lint) inside frontend/ instead of the repo
  # root — a separate npm project with its own package-lock.json.
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx oxlint

  # Per Master Plan v1.2 (Section 9): the manual procedure in
  # db/tests/rls_negative.test.md has been converted into an automated script
  # (db/tests/rls_negative.sql), wired into a real Postgres service container
  # below. ACTUALLY RUN against a real GitHub Actions Postgres service
  # container, not simulated — a fresh Postgres 16, migrations applied for
  # real, and the RLS negative test genuinely passed (see this file's own
  # top comment for the run link).
  #
  # "Apply migrations" below was hardcoded to just 0001/0002 until
  # 2026-09-11 — a real, disclosed gap the Platform Readiness Assessment
  # flagged: the other 20 migrations added since were never applied in CI at
  # all, so a schema bug anywhere in them (a typo, a bad constraint, a
  # migration that doesn't apply cleanly after the ones before it) could
  # reach `main` completely undetected. Now applies every real migration
  # file, in order, by globbing the directory rather than hardcoding a list
  # — so this can't go stale again the next time a migration is added.
  db-rls-negative-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apply migrations
        run: |
          for f in $(ls db/migrations/*.sql | sort); do
            echo "Applying $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Create the non-superuser app role the negative test runs as
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c \
            "create role mytrima_app login password 'ci_only_password'; \
             grant select, insert, update, delete on all tables in schema public to mytrima_app;"
      - name: Run RLS negative test
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f db/tests/rls_negative.sql

  # Real dependency scanning via audit-ci (a real devDependency — see
  # package.json), gated on audit-ci.jsonc's narrow, documented allowlist.
  # Verified locally: `npx audit-ci --high` (no allowlist) genuinely exits 1
  # on this project's real current dependency tree; `npx audit-ci --config
  # audit-ci.jsonc` genuinely exits 0. Secret scanning (the other half of
  # this job's name) is still not wired up — gitleaks/trufflehog need their
  # own pass; not claimed done here.
  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx audit-ci --config audit-ci.jsonc

  # Real SAST via Semgrep's own public, no-login-required registry ruleset.
  # Could NOT be verified locally — Semgrep has no native Windows build, and
  # this machine has neither Docker nor a usable WSL distro. Verify by this
  # job's own actual run once pushed (see README's "CI: from honest
  # placeholders to real scanners" section for that run's real result) —
  # exactly the same "GitHub Actions is the only place this can genuinely be
  # proven" situation db-rls-negative-tests' Postgres service container was
  # already in.
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: semgrep scan --config p/ci --error
